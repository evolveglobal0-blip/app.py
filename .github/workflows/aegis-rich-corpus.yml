name: AEGIS Rich Corpus Staging

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Clone rich public football source
        run: git clone --depth 1 https://github.com/xgabora/Club-Football-Match-Data-2000-2025.git source
      - name: Filter Big Five and normalize
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p corpus
          python - <<'PY'
          import pandas as pd, json, hashlib
          from pathlib import Path
          p=Path('source/data/Matches.csv')
          df=pd.read_csv(p,low_memory=False)
          divisions={'E0':'Premier League','SP1':'La Liga','D1':'Bundesliga','I1':'Serie A','F1':'Ligue 1'}
          d=df[df['Division'].isin(divisions)].copy()
          d['MatchDate']=pd.to_datetime(d['MatchDate'],errors='coerce')
          d=d[(d.MatchDate>='2015-08-01') & (d.MatchDate<'2025-08-01')].copy()
          out=pd.DataFrame({
            'date':d.MatchDate.dt.strftime('%Y-%m-%d'),
            'competition':d.Division.map(divisions),
            'season':d.get('Season',pd.Series(index=d.index,dtype=str)),
            'home_team':d.HomeTeam,'away_team':d.AwayTeam,
            'home_goals':pd.to_numeric(d.FTHome,errors='coerce'),
            'away_goals':pd.to_numeric(d.FTAway,errors='coerce'),
            'status':'FINISHED',
            'home_elo':pd.to_numeric(d.HomeElo,errors='coerce'),
            'away_elo':pd.to_numeric(d.AwayElo,errors='coerce'),
            'form3_home':pd.to_numeric(d.Form3Home,errors='coerce'),
            'form3_away':pd.to_numeric(d.Form3Away,errors='coerce'),
            'form5_home':pd.to_numeric(d.Form5Home,errors='coerce'),
            'form5_away':pd.to_numeric(d.Form5Away,errors='coerce'),
            'odds_home':pd.to_numeric(d.OddHome,errors='coerce'),
            'odds_draw':pd.to_numeric(d.OddDraw,errors='coerce'),
            'odds_away':pd.to_numeric(d.OddAway,errors='coerce'),
            'over25_odds':pd.to_numeric(d.Over25,errors='coerce'),
            'under25_odds':pd.to_numeric(d.Under25,errors='coerce')
          }).dropna(subset=['date','home_team','away_team','home_goals','away_goals'])
          out=out.sort_values(['date','competition','home_team','away_team']).drop_duplicates(['date','competition','home_team','away_team'])
          out.to_csv('corpus/rich_history.csv',index=False)
          m={'real_corpus':True,'rows':len(out),'competitions':sorted(out.competition.unique().tolist()),'years':int(out.date.str[:4].nunique()),'sha256':hashlib.sha256(Path('corpus/rich_history.csv').read_bytes()).hexdigest()}
          Path('corpus/CORPUS_MANIFEST.json').write_text(json.dumps(m,indent=2)); print(json.dumps(m,indent=2)); assert len(out)>=10000 and len(m['competitions'])==5
          PY
      - name: Upload rich corpus
        uses: actions/upload-artifact@v4
        with:
          name: aegis-rich-corpus
          path: corpus/
          retention-days: 7
