name: AEGIS Independent StatsBomb Validation

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Clone StatsBomb Open Data
        run: git clone --depth 1 https://github.com/hudl/open-data.git statsbomb
      - name: Build independent coverage inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          comps=json.load(open('statsbomb/data/competitions.json'))
          rows=[]
          for c in comps:
              cid=c['competition_id']; name=c.get('competition_name','')
              base=Path('statsbomb/data/matches')/str(cid)
              if base.exists():
                  for f in sorted(base.glob('*.json')):
                      matches=json.load(open(f))
                      rows.append({'competition_id':cid,'competition':name,'season_file':f.name,'matches':len(matches)})
          payload={'source':'StatsBomb Open Data','rows':rows,'competition_season_files':len(rows),'matches':sum(x['matches'] for x in rows)}
          Path('statsbomb_inventory.json').write_text(json.dumps(payload,indent=2))
          print(json.dumps({'competition_season_files':len(rows),'matches':payload['matches']},indent=2))
          PY
      - name: Upload independent validation inventory
        uses: actions/upload-artifact@v4
        with:
          name: aegis-statsbomb-validation
          path: statsbomb_inventory.json
          retention-days: 7
